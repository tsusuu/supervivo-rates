name: rates

on:
  schedule:
    # 12:10 KST (월~금), 하루 한 번. 카드사는 매입일 첫 고시 환율 하나만 쓰므로 하루 1회면 충분
    - cron: "10 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch rates
        env:
          KEXIM_AUTHKEY: ${{ secrets.KEXIM_AUTHKEY }}
        run: python3 scripts/fetch_rates.py
      # 공휴일은 주 1회(월요일)만 받는다. 같은 작업 안이라 Action 실행 횟수가 늘지 않는다.
      # KASI_SERVICE_KEY가 없으면 스크립트가 건너뛰고, 실패해도 환율 갱신은 계속된다
      - name: Fetch holidays (Mondays)
        continue-on-error: true
        env:
          KASI_SERVICE_KEY: ${{ secrets.KASI_SERVICE_KEY }}
        run: |
          if [ "$(TZ=Asia/Seoul date +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ ! -f holidays.json ]; then
            python3 scripts/fetch_holidays.py
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A rates.json history
          if [ -f holidays.json ]; then git add holidays.json; fi
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 환율 갱신 $(TZ=Asia/Seoul date +%F)"
            git push
          fi
