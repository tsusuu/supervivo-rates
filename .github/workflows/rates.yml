name: rates

on:
  schedule:
    # 12:10 KST (월~금), 하루 한 번. 카드사는 매입일 첫 고시 환율 하나만 쓰므로 하루 1회면 충분
    - cron: "10 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch rates
        env:
          KEXIM_AUTHKEY: ${{ secrets.KEXIM_AUTHKEY }}
        run: python3 scripts/fetch_rates.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A rates.json history
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 환율 갱신 $(TZ=Asia/Seoul date +%F)"
            git push
          fi
