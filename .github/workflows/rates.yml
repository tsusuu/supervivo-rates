name: 환율 받기

on:
  schedule:
    # 영업일 11:30, 12:30 KST(수출입은행은 오전 11시 전후 갱신)
    - cron: "30 2 * * 1-5"
    - cron: "30 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 환율 받기
        env:
          KEXIM_AUTHKEY: ${{ secrets.KEXIM_AUTHKEY }}
        run: python3 scripts/fetch_rates.py
      - name: 바뀌었으면 올리기
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "바뀐 것 없음"
            exit 0
          fi
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add rates.json history
          git commit -m "rates: $(date -u +%Y-%m-%d)"
          git push
