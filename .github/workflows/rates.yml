name: rates

on:
  schedule:
    # 11:30, 12:30 KST (월~금)
    - cron: "30 2 * * 1-5"
    - cron: "30 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch rates
        env:
          KEXIM_AUTHKEY: ${{ secrets.KEXIM_AUTHKEY }}
        run: python scripts/fetch_rates.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A rates.json history
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 환율 갱신 $(TZ=Asia/Seoul date +%F)"
            git push
          fi
